<!doctype html>
<!-- lang and dir are placeholders only: useDirection overwrites both on <html>
     as soon as the locale resolves. Do not hardcode a direction here. -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The same in both languages: nothing sets document.title at run time.
         The platform serves three municipalities, so it carries Enabel's name. -->
    <title>Enabel M&amp;E</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
